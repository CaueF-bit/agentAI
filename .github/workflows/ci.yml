name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para a verificação de segredos

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalação reproduzível (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes automatizados
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Verificação de segredos (arquivos atuais)
        run: npm run secrets:scan

      - name: Verificação de segredos (histórico, gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependências vulneráveis (altas ou críticas bloqueiam)
        run: npm audit --omit=dev --audit-level=high
